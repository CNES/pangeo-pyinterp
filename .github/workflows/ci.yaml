name: CI

on:
  push:
    branches: "**"
  pull_request:
    branches: master

permissions:
  contents: read

# Cancel superseded runs of the same pull request. Every push gets its own
# group, so all pushed commits are tested and nothing is serialized; the
# deploy job serializes GitHub Pages deployments on its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# ccache settings shared by the jobs that compile through ccache (only those set
# CMAKE_CXX_COMPILER_LAUNCHER). The cache directory is persisted between runs
# with actions/cache. The PCH-related sloppiness is required for ccache to reuse
# objects compiled with the precompiled header (PYINTERP_USE_PCH).
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 500M
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime

jobs:
  geometry-stubs-sync:
    name: geometry-stubs-sync
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Check pyinterp/geometry stubs are in sync
      run: python scripts/generate_geometry_stubs.py --check

  coverage:
    name: coverage
    needs: geometry-stubs-sync
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive
        fetch-depth: 0
        fetch-tags: true

    - name: Setup Miniconda
      uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
      with:
        cache-downloads: true
        condarc: |
          channels:
            - conda-forge
        # JSON::XS, only packaged by bioconda, makes LCOV several times faster
        # than with the JSON module shipped with Perl. The folded style (>-) is
        # required: setup-micromamba splits create-args on spaces, not on
        # newlines.
        create-args: >-
          python=3.12
          bioconda::perl-json-xs
          ccache
        environment-name: pyinterp
        environment-file: .github/environments/linux.yml
        init-shell: bash

    - name: Restore ccache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ github.job }}-${{ runner.arch }}-${{ matrix.python-version }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ github.job }}-${{ runner.arch }}-${{ matrix.python-version }}-

    - name: Generate coverage data
      shell: bash -l {0}
      env:
        # Read by CMake (>= 3.17) when the build tree is configured.
        CMAKE_CXX_COMPILER_LAUNCHER: ccache
        # ccache identifies GCC from the compiler name, which fails for the
        # conda c++ driver: as an unknown compiler, it is treated like Clang
        # and the precompiled header is rebuilt as soon as the mtime of one
        # of its headers changes, i.e. on every fresh checkout and conda
        # environment, which also invalidates every object that uses it.
        CCACHE_COMPILERTYPE: gcc
        # With a base directory, ccache passes relative source paths to the
        # compiler, which records them in the .gcno files. lcov then resolves
        # them against its --base-directory, treats every source as external
        # and captures nothing. The workspace path is the same from one run to
        # the next, so the cache is still reused without it.
        CCACHE_BASEDIR: ""
      run: |
        ./scripts/generate_coverage.sh

    - name: ccache statistics
      shell: bash -l {0}
      run: |
        ccache --show-stats

    - name: Upload HTML report as artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-report
        path: build/htmllcov

  linux:
    name: ${{ matrix.python-version }}-posix
    needs: geometry-stubs-sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        # Python 3.12 is used in all other jobs
        python-version: ['3.11', '3.13', '3.14']
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive
        fetch-depth: 0
        fetch-tags: true

    - name: Setup Miniconda
      uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
      with:
        cache-downloads: true
        condarc: |
          channels:
            - conda-forge
        create-args: >-
          python=${{ matrix.python-version }}
          ccache
        environment-name: pyinterp
        environment-file: .github/environments/linux.yml
        init-shell: bash

    - name: Restore ccache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ github.job }}-${{ runner.arch }}-${{ matrix.python-version }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ github.job }}-${{ runner.arch }}-${{ matrix.python-version }}-

    - name: Build extension
      shell: bash -l {0}
      env:
        # Read by CMake (>= 3.17) when the build tree is configured.
        CMAKE_CXX_COMPILER_LAUNCHER: ccache
        # ccache identifies GCC from the compiler name, which fails for the
        # conda c++ driver: as an unknown compiler, it is treated like Clang
        # and the precompiled header is rebuilt as soon as the mtime of one
        # of its headers changes, i.e. on every fresh checkout and conda
        # environment, which also invalidates every object that uses it.
        CCACHE_COMPILERTYPE: gcc
      run: |
        python setup.py build_ext
        python setup.py build

    - name: ccache statistics
      shell: bash -l {0}
      run: |
        ccache --show-stats

    - name: Run tests
      shell: bash -l {0}
      run: |
        pytest -v -ra

  linux_arm64:
    name: ${{ matrix.python-version }}-arm64
    needs: geometry-stubs-sync
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive
        fetch-depth: 0
        fetch-tags: true
    - name: Setup Miniconda
      uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
      with:
        cache-downloads: true
        condarc: |
          channels:
            - conda-forge
        environment-name: pyinterp
        create-args: >-
          python=${{ matrix.python-version }}
          ccache
          cmake
          cxx-compiler
          dask
          libboost-devel
          make
          numcodecs
          numpy
          pandas
          pip
          pytest
          setuptools
          xarray
        init-shell: bash
    - name: Restore ccache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ github.job }}-${{ runner.arch }}-${{ matrix.python-version }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ github.job }}-${{ runner.arch }}-${{ matrix.python-version }}-
    - name: Build extension
      shell: bash -l {0}
      env:
        # Read by CMake (>= 3.17) when the build tree is configured.
        CMAKE_CXX_COMPILER_LAUNCHER: ccache
        # ccache identifies GCC from the compiler name, which fails for the
        # conda c++ driver: as an unknown compiler, it is treated like Clang
        # and the precompiled header is rebuilt as soon as the mtime of one
        # of its headers changes, i.e. on every fresh checkout and conda
        # environment, which also invalidates every object that uses it.
        CCACHE_COMPILERTYPE: gcc
      run: |
        python setup.py build_ext
        python setup.py build
    - name: ccache statistics
      shell: bash -l {0}
      run: |
        ccache --show-stats
    - name: Run tests
      shell: bash -l {0}
      run: |
        pytest -v -ra

  macos:
    name: macos
    needs: geometry-stubs-sync
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive
        fetch-depth: 0
        fetch-tags: true

    - name: Setup Miniconda
      uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
      with:
        cache-downloads: true
        condarc: |
          channels:
            - conda-forge
        create-args: >-
          python=3.14
          ccache
        environment-name: pyinterp
        environment-file: .github/environments/osx.yml
        init-shell: bash

    - name: Restore ccache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ github.job }}-${{ runner.arch }}-${{ matrix.python-version }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ github.job }}-${{ runner.arch }}-${{ matrix.python-version }}-

    - name: Build extension
      shell: bash -l {0}
      env:
        # Read by CMake (>= 3.17) when the build tree is configured.
        CMAKE_CXX_COMPILER_LAUNCHER: ccache
      run: |
        python setup.py build_ext
        python setup.py build

    - name: ccache statistics
      shell: bash -l {0}
      run: |
        ccache --show-stats

    - name: Run tests
      shell: bash -l {0}
      run: |
        pytest -v -ra

    - name: Generate Documentation
      shell: bash -l {0}
      run: |
        sphinx-build -b html docs/source docs/build

    - name: Upload artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: docs/build

  # Publish the documentation built by the macos job. Pull requests never reach
  # this job: fork PRs cannot obtain the Pages/OIDC permissions it requires.
  deploy:
    name: deploy-docs
    needs: macos
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # Run one deployment at a time and never interrupt one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
    - name: Setup Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  win:
    name: win
    needs: geometry-stubs-sync
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive

    - name: Setup Miniconda
      uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
      with:
        cache-downloads: true
        condarc: |
          channels:
            - conda-forge
        create-args: |
          python=3.14
        environment-name: pyinterp
        environment-file: .github/environments/win.yml

    # The windows-2025 image now ships Visual Studio 18 (2026), so the pinned
    # "Visual Studio 17 2022" CMake generator no longer finds an instance.
    # Activate the MSVC developer environment (cl.exe + Ninja on PATH) and build
    # with the version-independent Ninja generator instead (see CMAKE_GEN).
    - name: Set up MSVC toolchain
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: x64

    - name: Building Testing Python Package
      shell: bash -l {0}
      env:
        CMAKE_GEN: Ninja
      run: |
        # Convert the backslashes in $CONDA_PREFIX to forward slashes; otherwise
        # they are stripped when the argument is forwarded to CMake.
        python setup.py build_ext --cmake-args="-DBoost_INCLUDE_DIRS=${CONDA_PREFIX//\\//}/Library/include"
        python setup.py build
        pytest -v -ra
