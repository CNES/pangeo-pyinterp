name: Build and publish to PyPI

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions: {}

jobs:
  # SECURITY.md lists the supported versions by year and is updated by hand:
  # block the release until it supports the year of the tag (or of today, for
  # a manual run).
  security-policy:
    name: Check the security policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that SECURITY.md supports the released version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(date -u +%Y)."
          fi
          python3 scripts/check_security_policy.py "${version}"

  build_wheels:
    name: Wheels on ${{ matrix.os }}
    needs: security-policy
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest       # Linux x86_64 (manylinux_2_28)
          - os: ubuntu-24.04-arm    # Linux aarch64 (manylinux_2_28)
          - os: macos-latest        # macOS arm64 only
            cibw_archs_macos: "arm64"
          - os: windows-2025        # Windows x86_64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      # Boost 1.90+ headers are required on all platforms.
      # Linux: handled inside the manylinux container via before-all (pyproject.toml).
      # macOS: handled via brew in before-all (pyproject.toml).
      # Windows: micromamba is set up here (same toolchain as the CI workflow)
      #          so the conda prefix is available before cibuildwheel runs.
      - name: Install Boost headers (Windows)
        if: runner.os == 'Windows'
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          cache-downloads: true
          condarc: |
            channels:
              - conda-forge
          create-args: "libboost-headers>=1.90"
          environment-name: boost-deps
          generate-run-shell: false
          init-shell: none

      - name: Export Boost prefix to GITHUB_ENV (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Use forward slashes: cibuildwheel runs CIBW_ENVIRONMENT_WINDOWS
          # through shlex, which would eat Windows backslashes.
          prefix="${MAMBA_ROOT_PREFIX//\\//}/envs/boost-deps/Library"
          echo "BOOST_PREFIX=${prefix}" >> "$GITHUB_ENV"

      # The windows-2025 image now ships Visual Studio 18 (2026), so the pinned
      # "Visual Studio 17 2022" CMake generator no longer finds an instance.
      # Activate the MSVC developer environment (cl.exe + Ninja on PATH) before
      # cibuildwheel runs; its exported variables propagate to the isolated
      # build subprocesses, which build with the Ninja generator (CMAKE_GEN).
      - name: Set up MSVC toolchain (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Build wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          # Windows: point CMake at the conda-forge Boost headers, build with
          # the version-independent Ninja generator (VS 18 broke the VS 17 one)
          # and in nanobind split mode, like the other platforms (pyproject.toml).
          CIBW_ENVIRONMENT_WINDOWS: >-
            CMAKE_PREFIX_PATH="${{ env.BOOST_PREFIX }}"
            CMAKE_GEN="Ninja"
            PYINTERP_NANOBIND_BACKEND_MODULE="nanobind_backend"
          # macOS: arm64 only (free Intel runners are deprecated).
          CIBW_ARCHS_MACOS: ${{ matrix.cibw_archs_macos }}
          # Sanity-check every built wheel imports (which loads the nanobind
          # backend in split mode) and exposes its version.
          CIBW_TEST_COMMAND: >-
            python -c "import pyinterp, pyinterp.core;
            print(pyinterp.__version__, pyinterp.core.__file__)"

      # Check that the abi3 wheel only uses the stable ABI of its Python floor
      # (abi3audit does not handle the abi3t wheels yet).
      - name: Audit the stable ABI wheels
        shell: bash
        run: pipx run abi3audit==0.0.26 --strict --report wheelhouse/*-abi3-*.whl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # The source distribution is built and published by the same workflow as the
  # wheels: PyPI flags a release whose files come from different workflows as
  # having an inconsistent provenance, and a single publish job never releases
  # the sdist without the wheels.
  build_sdist:
    name: Build source distribution
    needs: security-policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  # Pre-release tags (e.g. v1.2.3rc1, v1.2.3.dev1, v1.2.3a1, v1.2.3b1) go to
  # TestPyPI; plain stable tags (vX.Y.Z) go to real PyPI.
  detect-target:
    name: Detect publish target
    needs: [build_wheels, build_sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - id: check
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
          fi

  publish-testpypi:
    name: Publish to TestPyPI
    needs: detect-target
    if: needs.detect-target.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pyinterp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: detect-target
    if: needs.detect-target.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyinterp
    permissions:
      id-token: write   # required for OIDC Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
