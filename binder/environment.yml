name: pyinterp
channels:
  - conda-forge
dependencies:
  # repo2docker only reads an exact version: with a range, it installs its
  # default Python, which the environment then replaces package by package.
  - python=3.14
  - cartopy
  - dask
  - matplotlib-base
  - numcodecs
  - pandas
  - pyinterp>=2026.11.0
  - sphinx-gallery
  - xarray
